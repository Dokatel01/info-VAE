# Publication quotidienne des articles « à intégrer » du Google Sheets : UN article par jour, du lundi au vendredi (jours de Paris),
# dès qu'une exécution GitHub Actions démarre (aucune heure imposée). Jamais le samedi ni le dimanche, même si GitHub retarde un passage.
# PHASE DE TEST : UN SEUL article est publié par jour ouvré (le premier « à intégrer » dans l'ordre du Sheet).
# Mode d'emploi et étapes de configuration : docs/automatisation-publication.md
name: Publication quotidienne des articles

on:
  schedule:
    # Plusieurs passages par jour (heures UTC, minutes « peu chargées » côté GitHub). Le premier qui démarre publie
    # l'article du jour ; les suivants constatent « déjà publié aujourd'hui » et ne font rien. Si un passage échoue,
    # le suivant réessaie le même jour. GitHub peut retarder un passage de plusieurs heures : sans importance.
    - cron: '17 6 * * 1-5'
    - cron: '17 10 * * 1-5'
    - cron: '17 14 * * 1-5'
    - cron: '17 18 * * 1-5'
  # Test sans modification des données : modifier .github/test-requests/mode.txt (simulation | test-lecture-docs).
  # La publication réelle n'est jamais possible par ce déclencheur.
  push:
    branches: [main]
    paths:
      - '.github/test-requests/mode.txt'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de lancement manuel'
        type: choice
        default: simulation
        options:
          - simulation        # lit le Sheet et les Docs, ne modifie rien
          - publication       # publie vraiment
          - test-lecture-docs # vérifie la lecture des Docs déjà publiés, ne modifie rien
          - test-ecriture     # vérifie que la passerelle accepte la signature d'écriture, sans rien écrire

# Un seul passage à la fois : un second passage attend la fin du premier (pas de publication en double).
concurrency:
  group: publication-articles
  cancel-in-progress: false

permissions:
  contents: write   # pour enregistrer l'article dans le dépôt (Vercel redéploie ensuite tout seul)

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Garde du week-end (jour de Paris) et date du jour
        id: garde
        run: |
          # Date et jour de la semaine à Paris, relevés UNE SEULE FOIS : la même date est transmise au robot
          # (PUBLISH_TODAY), donc un passage commencé le vendredi reste « du vendredi » même s'il finit après minuit.
          DATE_PARIS=$(TZ=Europe/Paris date +%F)
          JOUR_PARIS=$(TZ=Europe/Paris date +%u)   # 1 = lundi ... 7 = dimanche
          echo "Date à Paris : $DATE_PARIS (jour $JOUR_PARIS de la semaine, 1 = lundi)"
          # Aucune contrainte d'heure. Un déclenchement programmé n'agit jamais le samedi ni le dimanche (heure de Paris),
          # même si GitHub l'a retardé depuis le vendredi.
          # « un seul article par jour » est garanti par le robot lui-même (pipeline.mjs).
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$JOUR_PARIS" -ge 6 ]; then
            echo "Week-end à Paris : ce déclenchement est ignoré, aucune publication le samedi ni le dimanche."
            echo "lancer=non" >> "$GITHUB_OUTPUT"
          else
            echo "lancer=oui" >> "$GITHUB_OUTPUT"
            echo "date=$DATE_PARIS" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.garde.outputs.lancer == 'oui'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.garde.outputs.lancer == 'oui'
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        if: steps.garde.outputs.lancer == 'oui'
        run: npm ci

      - name: Lancer la publication
        if: steps.garde.outputs.lancer == 'oui'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_TAB: ${{ vars.SHEET_TAB }}
          SITE_URL: ${{ vars.SITE_URL }}
          GIT_AUTHOR_NAME: Info VAE - publication automatique
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: Info VAE - publication automatique
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
          MODE: ${{ github.event.inputs.mode }}
          PUBLISH_TODAY: ${{ steps.garde.outputs.date }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="$(grep -v '^#' .github/test-requests/mode.txt | tr -d '[:space:]')"
            case "$MODE" in
              simulation|test-lecture-docs|test-ecriture) ;;
              *) echo "Mode « $MODE » non autorisé par ce déclencheur (simulation, test-lecture-docs ou test-ecriture seulement)."; exit 1 ;;
            esac
          fi
          case "$MODE" in
            simulation)        node scripts/publish/run.mjs --dry-run ;;
            test-lecture-docs) node scripts/publish/run.mjs --selfcheck ;;
            test-ecriture)     node scripts/publish/run.mjs --test-ecriture ;;
            *)                 node scripts/publish/run.mjs ;;
          esac
